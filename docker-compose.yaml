services:
  db:
    image: postgres:18
    container_name: my-postgres
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: blog
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql   # Postgres 18+
      # for Postgres 17 or older use: pgdata:/var/lib/postgresql/data

volumes:
  pgdata: